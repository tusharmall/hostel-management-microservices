spring.application.name=api-gateway
server.port=8080

springdoc.enable-native-support=true
springdoc.show-actuator=true
#springdoc.api-docs.path=/gateway-api-docs # Add this line to change the gateway's own API docs path
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=http://eureka-server:8762/eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=false

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Specific API Docs routes first to ensure they are matched
spring.cloud.gateway.routes[0].id=course-service-api-docs
spring.cloud.gateway.routes[0].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/courses/v3/api-docs/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/courses/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[1].id=room-service-api-docs
spring.cloud.gateway.routes[1].uri=lb://ROOM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/rooms/v3/api-docs/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/rooms/(?<segment>.*), /${segment}

# General service routes (after specific API docs routes)
spring.cloud.gateway.routes[2].id=course-service
spring.cloud.gateway.routes[2].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/courses/**
# spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=room-service
spring.cloud.gateway.routes[3].uri=lb://ROOM-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/rooms/**
# spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].id=course-auth
spring.cloud.gateway.routes[4].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**
# spring.cloud.gateway.routes[4].filters[0]=RewritePath=/auth/(?<segment>.*), /${segment}

# Route for the swagger-config that the UI page will request.
# spring.cloud.gateway.routes[4].id=swagger-config
# spring.cloud.gateway.routes[4].uri=no://op
# spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/swagger-config
springdoc.swagger-ui.configUrl=/v3/api-docs/swagger-config
