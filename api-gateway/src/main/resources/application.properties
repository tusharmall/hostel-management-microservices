# springdoc.swagger-ui.urls[0].url=/courses/v3/api-docs
# springdoc.swagger-ui.urls[1].name=Room Service
# springdoc.swagger-ui.urls[1].url=/rooms/v3/api-docs
# springdoc.swagger-ui.urls[0].name=Course Service
# springdoc.swagger-ui.urls[0].url=http://localhost:8081/swagger-ui/index.html#
# springdoc.swagger-ui.urls[1].name=Room Service
# springdoc.swagger-ui.urls[1].url=http://localhost:8082/swagger-ui/index.html
# springdoc.swagger-ui.urls[0].name=Course Service
# springdoc.swagger-ui.urls[0].url=http://course-service:8081/v3/api-docs
# springdoc.swagger-ui.urls[1].name=Room Service
# springdoc.swagger-ui.urls[1].url=http://room-service:8082/v3/api-docs
springdoc.swagger-ui.urls[0].name=Course Service
springdoc.swagger-ui.urls[0].url=/courses/v3/api-docs
springdoc.swagger-ui.urls[1].name=Room Service
springdoc.swagger-ui.urls[1].url=/rooms/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true